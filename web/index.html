<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="QanoonDaan: plain-English information about the Pakistan Penal Code. Legal information, not legal advice." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14171b" media="(prefers-color-scheme: dark)" />
    <title>QanoonDaan</title>
    <!-- Inline SVG favicon: no extra file to serve. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f4d6e'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='system-ui,sans-serif' font-size='18' font-weight='800' fill='white'%3EQ%3C/text%3E%3C/svg%3E"
    />
    <script>
      // Apply the saved theme BEFORE React loads, so the page does not flash
      // white in dark mode. Reads the same localStorage key the Settings
      // context writes (src/state/SettingsContext.tsx).
      (function () {
        try {
          var raw = localStorage.getItem('qd.settings');
          var theme = raw ? JSON.parse(raw).theme : 'system';
          if (theme === 'system' || !theme) {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          /* ignore: storage may be blocked in private mode */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
